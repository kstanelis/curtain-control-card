name: Validate

# Not on push/pull_request yet: HACS reads the built card from a GitHub release, and until the
# first release exists every run fails on repository structure.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS / Marketplace repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        # hacs/action publishes no recent tags; HACS docs recommend main. Pinned to its commit.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-11-10
        with:
          category: plugin
