# Demo covers for testing curtain-control-card in a real Home Assistant.
# Load as a package together with ha-demo-helpers.yaml; see dev/README.md.
# Legacy template syntax for HA 2024.8 (removed in newer releases).

cover:
  - platform: template
    covers:
      cc_living_left:
        friendly_name: Living left
        unique_id: cc_living_left
        device_class: curtain
        position_template: "{{ states('input_number.cc_living_left_position') | int(0) }}"
        availability_template: "{{ is_state('input_boolean.cc_living_left_available', 'on') }}"
        open_cover:
          action: input_number.set_value
          target:
            entity_id: input_number.cc_living_left_position
          data:
            value: 100
        close_cover:
          action: input_number.set_value
          target:
            entity_id: input_number.cc_living_left_position
          data:
            value: 0
        stop_cover:
          - delay: 0
        set_cover_position:
          action: input_number.set_value
          target:
            entity_id: input_number.cc_living_left_position
          data:
            value: '{{ position }}'
      cc_living_right:
