# Demo covers for testing curtain-control-card in a real Home Assistant.
# Load as a package together with ha-demo-helpers.yaml; see dev/README.md.
# Modern template syntax (HA 2025.10+).

template:
  - cover:
      - name: Living left
        unique_id: cc_living_left
        default_entity_id: cover.cc_living_left
        device_class: curtain
        position: "{{ states('input_number.cc_living_left_position') | int(0) }}"
        availability: "{{ is_state('input_boolean.cc_living_left_available', 'on') }}"
        open_cover:
          action: input_number.set_value
          target:
            entity_id: input_number.cc_living_left_position
          data:
            value: 100
        close_cover:
          action: input_number.set_value
          target:
            entity_id: input_number.cc_living_left_position
          data:
            value: 0
        stop_cover:
          - delay: 0
        set_cover_position:
          action: input_number.set_value
          target:
            entity_id: input_number.cc_living_left_position
          data:
            value: '{{ position }}'
      - name: Living right
